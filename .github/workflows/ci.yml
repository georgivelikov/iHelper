name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api-client/package-lock.json
            frontend/package-lock.json
      - name: API client is in sync with the OpenAPI snapshot
        working-directory: api-client
        run: |
          npm ci
          npm run generate
          git diff --exit-code src/schema.d.ts
          npm run typecheck
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
