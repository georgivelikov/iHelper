name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api-client/package-lock.json
            frontend/package-lock.json
      - name: API client is in sync with the OpenAPI snapshot
        working-directory: api-client
        run: |
          npm ci
          npm run generate
          git diff --exit-code src/schema.d.ts
          npm run typecheck
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ihelper_e2e
          POSTGRES_USER: ihelper
          POSTGRES_PASSWORD: ihelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ihelper -d ihelper_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api-client/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix api-client
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright (starts backend and frontend itself)
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-image app (jar + bundled frontend)
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Publish to GitHub Container Registry (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
