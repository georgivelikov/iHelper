spring:
  application:
    name: ihelper
  docker:
    compose:
      # compose file lives at the repo root, shared by dev and (later) the packaged app
      file: ../docker-compose.yml
      lifecycle-management: start-only
  datasource:
    # Used when not started through docker compose (e.g. the e2e and prod profiles override this).
    url: jdbc:postgresql://localhost:5432/ihelper
    username: ihelper
    password: ihelper
  web:
    resources:
      # SpaConfig serves the bundled frontend (with index.html fallback) instead of Boot's default handler
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

ihelper:
  cors:
    # comma separated; add the hosted web origin in the prod profile
    allowed-origins: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:postgresql://localhost:5432/ihelper_e2e
  docker:
    compose:
      enabled: false
  flyway:
    # E2eDatabaseConfig cleans and migrates at startup; only this profile may clean.
    clean-disabled: false
server:
  port: 8081
ihelper:
  cors:
    # Vite dev server used by Playwright; the proxy forwards its Origin header unchanged.
    allowed-origins: http://localhost:5174

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
# Phase 6 adds: JWT auth, CORS, actuator
