services:
  postgres:
    image: postgres:17.6
    container_name: ihelper-postgres
    environment:
      POSTGRES_DB: ihelper
      POSTGRES_USER: ihelper
      POSTGRES_PASSWORD: ihelper
    ports:
      - "5432:5432"
    volumes:
      - ihelper-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihelper -d ihelper"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole app (API + bundled website) as it would be hosted: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: ihelper-app
    depends_on:
      postgres:
        condition: service_healthy
    # Runs the real hosted configuration (prod profile). Copy .env.example to .env and set the secrets;
    # without IHELPER_JWT_SECRET the app refuses to start (by design).
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ihelper
      DB_USER: ihelper
      DB_PASSWORD: ihelper
      IHELPER_JWT_SECRET: ${IHELPER_JWT_SECRET:-}
      IHELPER_REGISTRATION: ${IHELPER_REGISTRATION:-invite}
      IHELPER_INVITE_CODE: ${IHELPER_INVITE_CODE:-}
      # http://localhost is not HTTPS; set to true when serving this behind TLS
      IHELPER_SECURE_COOKIE: ${IHELPER_SECURE_COOKIE:-false}
    ports:
      - "8080:8080"

volumes:
  ihelper-pgdata:
