services:
  postgres:
    image: postgres:17.6
    container_name: ihelper-postgres
    environment:
      POSTGRES_DB: ihelper
      POSTGRES_USER: ihelper
      POSTGRES_PASSWORD: ihelper
    ports:
      - "5432:5432"
    volumes:
      - ihelper-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihelper -d ihelper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ihelper-pgdata:
