services:
  postgres:
    image: postgres:17.6
    container_name: ihelper-postgres
    environment:
      POSTGRES_DB: ihelper
      POSTGRES_USER: ihelper
      POSTGRES_PASSWORD: ihelper
    ports:
      - "5432:5432"
    volumes:
      - ihelper-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihelper -d ihelper"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole app (API + bundled website) as it would be hosted: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: ihelper-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ihelper
      SPRING_DATASOURCE_USERNAME: ihelper
      SPRING_DATASOURCE_PASSWORD: ihelper
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  ihelper-pgdata:
