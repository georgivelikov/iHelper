# Fly.io config for iHelper. Secrets (JWT secret, invite code, DB credentials) are set with `fly secrets set`,
# never here. See docs/RUNBOOK.md.
app = "ihelper"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  IHELPER_REGISTRATION = "invite"
  # Self-run Fly Postgres (app ihelper-db). Only DB_PASSWORD is a secret.
  DB_URL = "jdbc:postgresql://ihelper-db.flycast:5432/ihelper"
  DB_USER = "ihelper"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
